services:
  postgres:
    image: postgres:16-alpine
    container_name: chatflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatflow}
      POSTGRES_USER: ${POSTGRES_USER:-chatflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatflow}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - chatflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-chatflow} -d ${POSTGRES_DB:-chatflow}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chatflow-postgres-data:
